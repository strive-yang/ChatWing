name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path('manifest.json').read_text(encoding='utf-8'))['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Tag must be v{version}, matching manifest.json')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)',
              changelog, re.MULTILINE | re.DOTALL,
          )
          if not section or not section.group(1).strip():
              raise SystemExit(f'CHANGELOG.md needs a nonempty [{version}] section')
          notes = section.group(1).strip() + '\n\n下载下方 ChatWing-' + version + '.zip，解压后在 chrome://extensions 中加载包含 manifest.json 的文件夹。详见仓库 README。\n'
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Package extension
        run: python tools/package.py
      - name: Publish release with installation package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/ChatWing-*.zip
          --verify-tag --title "ChatWing $RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
